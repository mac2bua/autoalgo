name: AutoAlgo Experiment Loop

on:
  schedule:
    - cron: "0 * * * *"  # Every hour at minute 0
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: autoalgo/${{ github.event.after }}
          token: ${{ secrets.AUTOALGO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Install bc for comparisons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bc > /dev/null

      - name: Run autoalgo experiment
        id: experiment
        run: |
          uv run evaluate.py > run.log 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 0 ]; then
            echo " Experiment completed successfully"
          else
            echo " Experiment failed or crashed"
          fi

      - name: Extract results
        id: results
        if: steps.experiment.outputs.EXIT_CODE == '0'
        run: |
          TOTAL_TIME=$(grep "^total_time_ms:" run.log | awk '{print $2}')
          MEMORY_MB=$(grep "^memory_mb:" run.log | awk '{print $2}')
          echo "TOTAL_TIME=$TOTAL_TIME" >> $GITHUB_OUTPUT
          echo "MEMORY_MB=$MEMORY_MB" >> $GITHUB_OUTPUT

      - name: Update results.tsv
        id: update_tsv
        if: steps.results.outcome == 'success'
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TOTAL_TIME=${{ steps.results.outputs.TOTAL_TIME }}
          MEMORY_MB=${{ steps.results.outputs.MEMORY_MB }}

          # Read previous best time from keep entries
          PREV_TOTAL=$(awk -F'\t' '$4=="keep" {print $2; exit}' results.tsv)

          # Determine if we should keep or discard using awk for float comparison
          STATUS="discard"
          if [ -z "$PREV_TOTAL" ] || [ "$PREV_TOTAL" = "baseline" ]; then
            STATUS="keep"
          else
            # Compare using awk (returns 1 if TOTAL_TIME < PREV_TOTAL)
            IS_BETTER=$(awk -v t="$TOTAL_TIME" -v p="$PREV_TOTAL" 'BEGIN { print (t < p) ? 1 : 0 }')
            if [ "$IS_BETTER" -eq 1 ]; then
              STATUS="keep"
            fi
          fi

          # Append to results
          printf "%s\t%s\t%s\t%s\t%s\n" "$COMMIT_HASH" "$TOTAL_TIME" "$MEMORY_MB" "$STATUS" "experiment - $(git log -1 --pretty=%B | head -n 1)" >> results.tsv

          # If keep, commit the changes
          if [ "$STATUS" = "keep" ]; then
            git config user.name "autoalgo-bot"
            git config user.email "autoalgo-bot@users.noreply.github.com"
            git add results.tsv
            git commit --amend --no-edit || true
          fi

      - name: Push changes
        if: steps.update_tsv.outcome == 'success'
        run: |
          git push origin autoalgo/${{ github.event.after }} || echo "Push skipped"

      - name: Log failure
        if: steps.experiment.outputs.EXIT_CODE != '0'
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TOTAL_TIME="0.0"
          MEMORY_MB="0.0"
          STATUS="crash"
          printf "%s\t%s\t%s\t%s\t%s\n" "$COMMIT_HASH" "$TOTAL_TIME" "$MEMORY_MB" "$STATUS" "experiment CRASHED - $(git log -1 --pretty=%B | head -n 1)" >> results.tsv
          echo "=== Run log (last 20 lines) ==="
          tail -n 20 run.log

      - name: Upload run log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-log-${{ github.run_id }}-${{ github.run_number }}
          path: run.log
          retention-days: 7
          if-no-files-found: warn
