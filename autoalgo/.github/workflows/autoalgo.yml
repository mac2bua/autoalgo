name: AutoAlgo Experiment Loop

on:
  schedule:
    - cron: "0 * * * *"  # Every hour at minute 0
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: autoalgo/${{ github.sha }}
          token: ${{ secrets.AUTOALGO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Get current branch
        id: branch
        run: echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Generate experiment description
        id: desc
        run: |
          # Create a description based on the current commit
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          echo "DESC=${COMMIT_MSG:0:100}" >> $GITHUB_OUTPUT

      - name: Run autoalgo experiment
        id: experiment
        run: |
          cd autoalgo
          uv run evaluate.py > run.log 2>&1
          EXIT_CODE=$?
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 0 ]; then
            echo " Experiment completed successfully"
          else
            echo " Experiment failed or crashed"
          fi

      - name: Extract results
        id: results
        if: steps.experiment.outputs.EXIT_CODE == '0'
        run: |
          cd autoalgo
          TOTAL_TIME=$(grep "^total_time_ms:" run.log | awk '{print $2}')
          MEMORY_MB=$(grep "^memory_mb:" run.log | awk '{print $2}')
          echo "TOTAL_TIME=$TOTAL_TIME" >> $GITHUB_OUTPUT
          echo "MEMORY_MB=$MEMORY_MB" >> $GITHUB_OUTPUT

      - name: Update results.tsv
        id: update_tsv
        if: steps.results.outcome == 'success'
        run: |
          cd autoalgo
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TOTAL_TIME=${{ steps.results.outputs.TOTAL_TIME }}
          MEMORY_MB=${{ steps.results.outputs.MEMORY_MB }}

          # Read previous baseline
          PREV_TOTAL=$(tail -n +2 results.tsv | head -1 | cut -f2)

          # Determine if we should keep or discard
          if [ -z "$PREV_TOTAL" ] || [ "$PREV_TOTAL" = "baseline" ] || [ $(echo "$TOTAL_TIME < $PREV_TOTAL" | bc -l) -eq 1 ]; then
            STATUS="keep"
            echo " New best time: $TOTAL_TIME ms (previous: $PREV_TOTAL ms)"
          else
            STATUS="discard"
            echo " Time not improved: $TOTAL_TIME ms (previous: $PREV_TOTAL ms)"
          fi

          # Append to results
          printf "%s\t%s\t%s\t%s\t%s\n" "$COMMIT_HASH" "$TOTAL_TIME" "$MEMORY_MB" "$STATUS" "experiment - ${{ steps.desc.outputs.DESC }}" >> results.tsv

          # If keep, commit the changes
          if [ "$STATUS" = "keep" ]; then
            git config user.name "autoalgo-bot"
            git config user.email "autoalgo-bot@users.noreply.github.com"
            git add results.tsv
            git commit --amend --no-edit || true
          fi

      - name: Push changes
        if: steps.update_tsv.outcome == 'success'
        run: |
          cd autoalgo
          git push origin autoalgo/${{ github.sha }} || echo "Push skipped"

      - name: Log failure
        if: steps.experiment.outputs.EXIT_CODE != '0'
        run: |
          cd autoalgo
          COMMIT_HASH=$(git rev-parse --short HEAD)
          PREV_TOTAL=$(tail -n +2 results.tsv | head -1 | cut -f2)
          TOTAL_TIME="0.0"
          MEMORY_MB="0.0"
          STATUS="crash"
          printf "%s\t%s\t%s\t%s\t%s\n" "$COMMIT_HASH" "$TOTAL_TIME" "$MEMORY_MB" "$STATUS" "experiment CRASHED - ${{ steps.desc.outputs.DESC }}" >> results.tsv
          echo "=== Run log (last 20 lines) ==="
          tail -n 20 run.log

      - name: Upload run log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-log-${{ github.run_id }}-${{ github.run_number }}
          path: autoalgo/run.log
          retention-days: 7
          if-no-files-found: warn
